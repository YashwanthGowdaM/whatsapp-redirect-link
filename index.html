<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhatsApp Number Scanner</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f6f8;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 440px;
    background: #ffffff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.12);
  }

  .header {
    margin-bottom: 18px;
  }

  .header h2 {
    margin: 0;
    color: #007e5a;
    font-size: 22px;
  }

  .header p {
    margin-top: 6px;
    font-size: 13px;
    color: #666;
  }

  .section {
    margin-bottom: 18px;
  }

  label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
  }

  .upload-box {
    height: 120px;
    border: 2px dashed #cfd6dc;
    border-radius: 8px;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #444;
    cursor: pointer;
    text-align: center;
  }

  .upload-box:hover {
    border-color: #007e5a;
    background: #f0fdf8;
  }

  input[type="file"] {
    display: none;
  }

  .info-box {
    background: #e9f4ff;
    color: #0b4aa2;
    font-size: 13px;
    padding: 10px 12px;
    border-left: 4px solid #1e73ff;
    border-radius: 4px;
  }

  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #cfd6dc;
    border-radius: 6px;
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 6px;
    border: none;
    background: #007e5a;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #006449;
  }

  .result {
    margin-top: 14px;
    font-size: 14px;
  }

  .error {
    color: #d32f2f;
    font-weight: 600;
  }

  a {
    color: #25D366;
    font-weight: 600;
    word-break: break-all;
  }

  .loading {
    color: #555;
  }
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <h2>📱 WhatsApp Number Scanner</h2>
    <p>Extract phone numbers from images and create WhatsApp links</p>
  </div>

  <!-- Camera / Image Upload -->
  <div class="section">
    <label>Scan using camera</label>
    <label class="upload-box">
      Tap to open camera or upload image
      <input
        type="file"
        accept="image/*"
        capture="environment"
        onchange="scanImage(this)"
      />
    </label>

     <!-- Gallery -->
    <label class="upload-box">
      🖼 Upload from gallery
      <input
        type="file"
        accept="image/*"
        onchange="scanImage(this)"
      />
    </label>
  </div>

  <div class="section">
    <div class="info-box">
      Upload or capture an image containing a phone number. The app will scan and create a WhatsApp link.
    </div>
  </div>

  <!-- Manual Entry -->
  <div class="section">
    <label>Or enter number manually</label>
    <input
      type="text"
      id="manualInput"
      placeholder="Enter phone number (e.g., 9876543210)"
    />
  </div>

  <button onclick="processManual()">Process Number</button>

  <div class="result" id="result"></div>

</div>

<script>
function normalizeNumber(raw) {
  const digits = raw.replace(/\D/g, "");

  if (digits.length === 10) return "91" + digits;
  if (digits.length === 12 && digits.startsWith("91")) return digits;

  return null;
}

function showResult(finalNumber, digits) {
  const result = document.getElementById("result");

  // Invalid number
  if (!finalNumber) {
    result.innerHTML = `
      <span class="error">Enter number is not correct..!</span><br>
      <small>Detected number: <b>${digits || "N/A"}</b></small>
    `;
    return;
  }

  // Valid number
  const link = `https://wa.me/${finalNumber}`;
  result.innerHTML = `
    ✅ WhatsApp Link:<br>
    <a href="${link}" target="_blank">${link}</a>
  `;
}


function processManual() {
  const value = document.getElementById("manualInput").value;
  const digits = value.replace(/\D/g, "");
  const finalNumber = normalizeNumber(value);

  showResult(finalNumber, digits);
}


function scanImage(input) {
  const file = input.files[0];
  if (!file) return;

  const result = document.getElementById("result");
  result.innerHTML = "📷 Scanning image…";

  Tesseract.recognize(file, "eng")
    .then(({ data: { text } }) => {
      const digits = text.replace(/\D/g, "");
      const finalNumber = normalizeNumber(text);

      showResult(finalNumber, digits);
    })
    .catch(() => {
      result.innerHTML = "<span class='error'>Scan failed</span>";
    });
}

</script>

</body>
</html>
