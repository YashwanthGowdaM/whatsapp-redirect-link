<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WhatsApp Number Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f4f6f8;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    width: 440px;
    background: #fff;
    padding: 24px;
    border-radius: 10px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.12);
  }

  .header {
    margin-bottom: 18px;
  }

  .header h2 {
    margin: 0;
    color: #007e5a;
    font-size: 22px;
  }

  .header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #666;
  }

  .section {
    margin-bottom: 18px;
  }

  .upload-box {
    border: 2px dashed #cfd6dc;
    border-radius: 8px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #444;
    font-size: 14px;
    background: #fafafa;
  }

  .upload-box:hover {
    border-color: #007e5a;
    background: #f0fdf8;
  }

  input[type="file"] {
    display: none;
  }

  .info-box {
    background: #e9f4ff;
    color: #0b4aa2;
    font-size: 13px;
    padding: 10px 12px;
    border-left: 4px solid #1e73ff;
    border-radius: 4px;
  }

  label {
    font-size: 14px;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #cfd6dc;
    border-radius: 6px;
  }

  button {
    width: 100%;
    padding: 11px;
    background: #007e5a;
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background: #006449;
  }

  .result {
    margin-top: 14px;
    font-size: 14px;
  }

  .error {
    color: #d32f2f;
    font-weight: 600;
  }

  a {
    color: #25D366;
    font-weight: 600;
    word-break: break-all;
  }
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <h2>📱 WhatsApp Number Scanner</h2>
    <p>Extract phone numbers from images and create WhatsApp links</p>
  </div>

  <div class="section">
    <label>Upload image</label>
    <label class="upload-box">
      Click to upload or drag an image
      <input type="file" accept="image/*" onchange="scanImage(this)">
    </label>
  </div>

  <div class="section">
    <div class="info-box">
      Upload an image containing a phone number. The app will extract the number and create a WhatsApp link.
    </div>
  </div>

  <div class="section">
    <label>Or enter number manually:</label>
    <input type="text" id="manualInput" placeholder="Enter phone number (e.g., 9876543210)">
  </div>

  <button onclick="processManual()">Process Number</button>

  <div class="result" id="result"></div>

</div>

<script>
function normalizeNumber(raw) {
  const digits = raw.replace(/\D/g, "");
  if (digits.length === 10) return "91" + digits;
  if (digits.length === 12) return digits;
  return null;
}

function showResult(link) {
  const result = document.getElementById("result");
  if (!link) {
    result.innerHTML = "<span class='error'>Number is not correct</span>";
    return;
  }
  result.innerHTML = `WhatsApp Link:<br><a href="https://wa.me/${link}" target="_blank">https://wa.me/${link}</a>`;
}

function processManual() {
  const input = document.getElementById("manualInput").value;
  showResult(normalizeNumber(input));
}

function scanImage(input) {
  const file = input.files[0];
  if (!file) return;

  const result = document.getElementById("result");
  result.innerHTML = "Scanning image…";

  Tesseract.recognize(file, "eng")
    .then(({ data: { text } }) => showResult(normalizeNumber(text)))
    .catch(() => result.innerHTML = "<span class='error'>Scan failed</span>");
}
</script>

</body>
</html>
